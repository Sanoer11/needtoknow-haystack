[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "needtoknow-haystack"
version = "0.1.0"
description = "Permission-aware retrieval for Haystack: drop documents a user is not allowed to see."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanoer Soni" }]
keywords = ["haystack", "rag", "access-control", "permissions", "llm", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["haystack-ai>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Sanoer11/needtoknow-haystack"
Issues = "https://github.com/Sanoer11/needtoknow-haystack/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/needtoknow_haystack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
